# Monkey Viewer - tested, reproducible builds of the Windows MSI / portable ZIP and the macOS DMG.
# Every third-party action is pinned to a full commit SHA (supply-chain hardening).
# Optional repository secrets (Settings > Secrets and variables > Actions):
#   WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD            Authenticode code signing
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY   Developer ID signing
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD                Apple notarization
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  WIX_VERSION: "5.0.2"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  checks:
    name: Static analysis & dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install audit tools (hash-locked)
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Bandit (security linter)
        run: python -m bandit -c pyproject.toml -r viewer monkey_viewer.py tools packaging -f txt -o bandit-report.txt || (cat bandit-report.txt; exit 1)
      - name: pip-audit (known vulnerabilities in bundled components)
        run: python -m pip_audit --strict --require-hashes --disable-pip -r requirements-lock.txt
      - name: Group Policy templates are up to date
        run: |
          python tools/gen_admx.py
          git diff --exit-code deploy/admx
      - name: Version tag matches app_info
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import sys; sys.path.insert(0, '.'); from viewer import app_info; print(app_info.VERSION)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != app_info.VERSION $v"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audit-reports
          path: bandit-report.txt

  windows:
    name: Windows MSI
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked components
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Tests
        run: python -m pytest -q -m "not gui"
      - name: GUI tests (informational)
        continue-on-error: true
        run: python -m pytest -q -m gui
      - name: Bundled helper programs (DjVuLibre, LibreDWG) - checksum-verified
        run: ./packaging/windows/fetch_helpers.ps1
      - name: Build the standalone program
        run: |
          python tools/write_build_info.py
          python -m PyInstaller MonkeyViewer.spec --noconfirm --clean
      - name: Self test of the frozen program
        env:
          MONKEYVIEWER_REQUIRE_HELPERS: "ddjvu,dwg2dxf,gpg"
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $p = Start-Process -FilePath dist\MonkeyViewer\MonkeyViewer.exe -ArgumentList '--self-test=release\selftest-windows.json' -Wait -PassThru
          Get-Content release\selftest-windows.json
          if ($p.ExitCode -ne 0) { throw "self test failed" }
      - name: Sign the program
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          try { ./packaging/windows/sign.ps1 -PfxPath $pfx -PfxPassword $env:WINDOWS_CERT_PASSWORD -Files dist\MonkeyViewer\MonkeyViewer.exe }
          finally { Remove-Item $pfx -Force }
      - name: Build the MSI (WiX ${{ env.WIX_VERSION }})
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION"
          python packaging/windows/make_wxs.py --src dist/MonkeyViewer --out build/msi
          $v = python -c "from viewer import app_info; print(app_info.VERSION)"
          wix build build/msi/MonkeyViewer.wxs -arch x64 -ext WixToolset.UI.wixext -o "release/MonkeyViewer-$v-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
      - name: Sign the MSI
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          try { ./packaging/windows/sign.ps1 -PfxPath $pfx -PfxPassword $env:WINDOWS_CERT_PASSWORD -Files (Get-ChildItem release\*.msi).FullName }
          finally { Remove-Item $pfx -Force }
      - name: Portable ZIP and SBOM
        run: |
          $v = python -c "from viewer import app_info; print(app_info.VERSION)"
          Compress-Archive -Path dist\MonkeyViewer\* -DestinationPath "release\MonkeyViewer-$v-win64-portable.zip"
          python -m cyclonedx_py requirements requirements-lock.txt --output-format JSON --output-file "release\MonkeyViewer-$v-sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: release/
          if-no-files-found: error

  macos:
    name: macOS DMG
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Tk is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Install locked components
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Tests
        run: python -m pytest -q -m "not gui"
      - name: GUI tests (informational)
        continue-on-error: true
        run: python -m pytest -q -m gui
      - name: Import the Developer ID certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; PW="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KC" >/dev/null
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086 # keychain paths are separate arguments
          security list-keychains -d user -s "$KC" $existing
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Bundled helper programs (DjVuLibre, LibreDWG)
        run: |
          brew install djvulibre gnupg dylibbundler
          required="ddjvu,gpg"
          if brew install libredwg; then required="ddjvu,gpg,dwg2dxf"; fi
          echo "MONKEYVIEWER_REQUIRE_HELPERS=$required" >> "$GITHUB_ENV"
          for pair in "djvulibre:ddjvu" "libredwg:dwg2dxf"; do
            tool="${pair%%:*}"; exe="${pair##*:}"
            brew list "$tool" >/dev/null 2>&1 || continue
            dest="build/vendor/$tool"; mkdir -p "$dest/lib"
            cp "$(brew --prefix "$tool")/bin/$exe" "$dest/"
            chmod u+w "$dest/$exe"
            dylibbundler -of -cd -b -x "$dest/$exe" -d "$dest/lib" -p "@executable_path/lib/"
            cp "$(brew --prefix "$tool")"/COPYING* "$dest/" 2>/dev/null || true
          done
          g="build/vendor/gnupg/bin"; mkdir -p "$g/lib"
          for exe in "$(brew --prefix gnupg)/bin/gpg" "$(brew --prefix gnupg)/bin/gpg-agent" \
                     "$(brew --prefix gnupg)/libexec/keyboxd"; do
            [ -f "$exe" ] || continue
            cp "$exe" "$g/"; chmod u+w "$g/$(basename "$exe")"
            dylibbundler -of -cd -b -x "$g/$(basename "$exe")" -d "$g/lib" -p "@executable_path/lib/"
          done
          cp "$(brew --prefix gnupg)"/COPYING* build/vendor/gnupg/ 2>/dev/null || true
          if [ -n "$MACOS_SIGN_IDENTITY" ]; then
            find build/vendor -type f \( -perm -u+x -o -name "*.dylib" \) -exec \
              codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" {} \;
          fi
          build/vendor/djvulibre/ddjvu --help 2>&1 | head -3 || true
      - name: Build the app
        run: |
          python tools/write_build_info.py
          python -m PyInstaller MonkeyViewer.spec --noconfirm --clean
      - name: Self test of the frozen app
        run: |
          mkdir -p release
          "dist/Monkey Viewer.app/Contents/MacOS/MonkeyViewer" --self-test=release/selftest-macos.json || { cat release/selftest-macos.json; exit 1; }
          cat release/selftest-macos.json
      - name: Sign
        run: |
          if [ -n "$MACOS_SIGN_IDENTITY" ]; then
            codesign --force --deep --options runtime --timestamp --entitlements packaging/macos/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" "dist/Monkey Viewer.app"
          else
            codesign --force --deep --sign - "dist/Monkey Viewer.app"
          fi
          codesign --verify --deep --strict "dist/Monkey Viewer.app"
      - name: Disk image
        run: |
          v=$(python -c "from viewer import app_info; print(app_info.VERSION)")
          bash packaging/macos/make_dmg.sh "dist/Monkey Viewer.app" "release/MonkeyViewer-$v-macos.dmg" "Monkey Viewer $v"
      - name: Notarize
        if: env.APPLE_ID != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          dmg=$(ls release/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: release/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Source archive and checksums
        run: |
          git archive --format=zip --prefix="MonkeyViewer-$GITHUB_REF_NAME-source/" -o "release/MonkeyViewer-$GITHUB_REF_NAME-source.zip" HEAD
          cd release && sha256sum -- * | grep -v SHA256SUMS > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # release notes: only this version's section of the changelog
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || cp CHANGELOG.md "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # the tag was moved to a fixed commit and built again: refresh the existing release
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Monkey Viewer $v" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "Monkey Viewer $v" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
